<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="SJ Family"/>
<meta name="theme-color" content="#0A3D6B"/>
<title>SJ Family</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./assets/icon-512_2.png"/>
<link rel="icon" type="image/png" href="./assets/icon-512_2.png"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap');
:root{--p:#0A3D6B;--pl:#1558A0;--g:#C9A84C;--gl2:#E2C97E;--co:#E8735A;--cl:#F08070;--sa:#6BAF92;--sd:#3D8A62;--lv:#9B8EC4;--ld:#6B5FA0;--bg:#F5F7FA;--dk:#0A1628;--gr:#5A6478;--gl:#DDE2EA;--gu:#EEF1F6;--pa:#E8735A;--pb:#1558A0;--r:18px;--sh:0 2px 16px rgba(10,22,40,0.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#0A1628;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,0.4)}
#loading{position:fixed;inset:0;background:#0A3D6B;z-index:9999}
#auth{flex:1;overflow-y:auto;padding:24px 22px;display:none;flex-direction:column;justify-content:center}
#auth.show{display:flex}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto}
#main{flex:1;display:none;flex-direction:column;overflow:hidden}
#main.show{display:flex}
.tb{background:var(--p);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:54px}
.tb-left{display:flex;align-items:center;gap:8px;flex:1}
.tb-right{display:flex;align-items:center;gap:6px}
.tb-logo-wrap{width:40px;height:40px;border-radius:50%;background:#0A3D6B;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.tb-logo-wrap img{width:40px;height:40px;object-fit:contain}
.tb-title{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;color:white;letter-spacing:1px}
.ib{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;position:relative;transition:background .2s}
.ib:hover{background:rgba(255,255,255,.25)}
.nb{position:absolute;top:0;right:0;width:13px;height:13px;border-radius:7px;background:var(--co);font-size:8px;font-weight:900;color:white;display:flex;align-items:center;justify-content:center}
.back-btn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;cursor:pointer;flex-shrink:0}
.ct{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px}
.ct::-webkit-scrollbar{display:none}
.bn{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gl);display:flex;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,0.08)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 0;border:none;background:none}
.nw{padding:3px 9px;border-radius:9px}
.ni.active .nw{background:rgba(10,61,107,.1)}
.nico{font-size:18px;line-height:1}
.nlb{font-size:10px;font-weight:700;color:var(--gr);font-family:'Nunito',sans-serif}
.ni.active .nlb{color:var(--p)}
.ncb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer}
.ncc{width:42px;height:42px;background:linear-gradient(135deg,var(--co),var(--g));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;margin-top:-13px;box-shadow:0 4px 14px rgba(232,115,90,.4)}
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:800;color:var(--dk);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi,.fs,.fta{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--gl);font-family:'Nunito',sans-serif;font-size:14px;color:var(--dk);background:var(--gu);outline:none;transition:border .2s;-webkit-appearance:none}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--pl);background:white}
.fta{resize:none;height:72px}
.fi-err{border-color:#DC2626!important}
.field-err{color:#DC2626;font-size:11px;font-weight:700;margin-top:4px;display:none}
.field-err.show{display:block}
.bp{background:linear-gradient(135deg,var(--p),var(--pl));color:white;border:none;border-radius:12px;padding:13px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;width:100%;box-shadow:0 4px 14px rgba(10,61,107,.28);transition:opacity .2s,transform .15s}
.bp:hover{opacity:.92;transform:translateY(-1px)}
.bp:disabled{opacity:.5;cursor:not-allowed;transform:none}
.bc{background:linear-gradient(135deg,var(--co),var(--cl));color:white;border:none;border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;width:100%}
.bo{background:transparent;color:var(--p);border:2px solid var(--p);border-radius:12px;padding:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;width:100%}
.bsm{padding:7px 12px;font-size:12px;border-radius:9px;width:auto}
.bdanger{background:transparent;color:#DC2626;border:2px solid #DC2626;border-radius:12px;padding:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.bgold{background:linear-gradient(135deg,var(--g),var(--gl2));color:white;border:none;border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;width:100%}
.card{background:white;border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:11px}
.ctt{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--dk);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bco{background:rgba(232,115,90,.15);color:var(--co)}.bpe{background:rgba(21,88,160,.15);color:var(--pl)}.bgo{background:rgba(201,168,76,.15);color:#8B6914}.bsa{background:rgba(107,175,146,.15);color:var(--sd)}.bgr{background:rgba(16,185,129,.15);color:#059669}.bre{background:rgba(239,68,68,.15);color:#DC2626}.bgr2{background:var(--gu);color:var(--gr)}.blv{background:rgba(155,142,196,.15);color:var(--ld)}
.tabs{display:flex;border-bottom:2px solid var(--gl);margin-bottom:13px}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--gr);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:'Nunito',sans-serif}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.caldn{text-align:center;font-size:10px;font-weight:800;color:var(--gr);padding:4px 0;text-transform:uppercase;letter-spacing:.3px}
.cald{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;transition:all .15s;position:relative}
.cald.om{color:rgba(107,114,128,.25)}.cald.tod{background:var(--p);color:white}.cald.dpa{background:rgba(232,115,90,.22);color:var(--co)}.cald.dpb{background:rgba(21,88,160,.22);color:var(--pl)}.cald.dtr{background:rgba(201,168,76,.28);color:#8B6914;border:2px solid var(--g)}.cald.dpnd{border:2px dashed var(--lv)}.cald.dhol{color:var(--sd);font-weight:900}.cald.dev::after{content:'';position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--co)}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.msh{background:white;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:6px 18px 28px;max-height:90vh;overflow-y:auto;animation:su .3s ease}
.msh::-webkit-scrollbar{display:none}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhd{width:36px;height:4px;background:var(--gl);border-radius:2px;margin:10px auto 15px}
.mtt{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;margin-bottom:15px;color:var(--dk)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--dk);color:white;padding:10px 17px;border-radius:12px;font-size:13px;font-weight:700;z-index:500;animation:ti .3s ease,tof .3s ease 2.2s forwards;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none}
@keyframes ti{from{opacity:0;top:56px}to{opacity:1;top:70px}}@keyframes tof{to{opacity:0}}
.info{background:rgba(10,61,107,.07);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--p);font-weight:600;margin-bottom:12px;border-left:3px solid var(--p)}
.warn{background:rgba(201,168,76,.1);border-radius:12px;padding:10px 12px;font-size:12px;color:#8B6914;font-weight:600;margin-bottom:12px;border-left:3px solid var(--g)}
.emsg{color:#DC2626;font-size:12px;font-weight:700;text-align:center;margin-top:7px;padding:8px;background:#FEF2F2;border-radius:9px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:white;flex-shrink:0}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.ht{background:white;border-radius:var(--r);padding:15px 12px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px}
.ht:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.11)}
.hti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.htl{font-size:13px;font-weight:800;color:var(--dk);line-height:1.2}.hts{font-size:11px;color:var(--gr)}
.row{display:flex;align-items:center}.rowb{display:flex;align-items:center;justify-content:space-between}
.g8{gap:8px}.g10{gap:10px}.f1{flex:1}
.sx{overflow-x:auto;white-space:nowrap;display:flex;gap:6px;padding-bottom:3px}
.sx::-webkit-scrollbar{display:none}
.tgl{width:42px;height:23px;border-radius:12px;position:relative;cursor:pointer;border:none;flex-shrink:0;transition:background .2s}
.tgl.on{background:var(--p)}.tgl.off{background:var(--gl)}
.tgl::after{content:'';position:absolute;top:2px;width:17px;height:17px;border-radius:50%;background:white;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tgl.on::after{left:22px}.tgl.off::after{left:3px}
.cm{display:flex;align-items:center;gap:9px;padding:10px;background:var(--gu);border-radius:12px;margin-bottom:9px}
.sto{flex:1;min-width:66px;padding:9px 5px;border-radius:12px;border:2px solid var(--gl);background:var(--gu);text-align:center;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:var(--gr);transition:all .2s}
.sto.sel{border-color:var(--p);background:rgba(10,61,107,.08);color:var(--p)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.mco{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:8px 8px 7px;color:white}
.ni2{display:flex;align-items:flex-start;gap:9px;padding:12px;background:white;border-radius:14px;margin-bottom:9px;box-shadow:0 1px 6px rgba(0,0,0,.05);position:relative}
.nd{position:absolute;top:14px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--co)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gu)}
.sr:last-child{border-bottom:none}
.di{display:flex;align-items:center;gap:10px;padding:10px;background:white;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.cc2{background:white;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.er{display:flex;align-items:center;gap:9px;padding:10px;background:var(--gu);border-radius:12px;margin-bottom:8px}
.exc{background:white;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);border-left:4px solid var(--g)}
.exc.accepted{border-left-color:var(--sa)}.exc.refused{border-left-color:var(--co)}.exc.pending{border-left-color:var(--lv)}
.tck{width:20px;height:20px;border-radius:7px;border:2px solid var(--gl);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.tck.done{background:var(--sa);border-color:var(--sa);color:white}
.circ-card{background:white;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);border:2px solid transparent;cursor:pointer;transition:all .2s}
.circ-card.active{border-color:var(--p);background:rgba(10,61,107,.04)}
.photo-prev{width:100%;max-height:140px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
.photo-prev.show{display:block}
.child-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(10,61,107,.08);color:var(--p);cursor:pointer;border:2px solid transparent;flex-shrink:0}
.child-tag.sel{border-color:var(--p);background:rgba(10,61,107,.15)}
.admin-stat{background:white;border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:center}
.admin-stat-num{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--p)}
.admin-stat-lbl{font-size:11px;color:var(--gr);font-weight:700;margin-top:2px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gu)}
.li:last-child{border-bottom:none}
</style>
</head>

async function loadProf(uid){
  try{const sn=await getDoc(doc(db,'users',uid));if(sn.exists())S.prof=sn.data();}catch(e){}
  await loadCircles(uid);
  if(S.circles.length>0){

    S.cd=S.circles.find(c=>c.id===S.cid)?.data||S.circles[0].data;
    startL();
  }
}

async function loadCircles(uid){
  S.circles=[];
  try{
    const qa=query(collection(db,'circles'),where('parentA','==',uid));
    (await getDocs(qa)).docs.forEach(d=>S.circles.push({id:d.id,data:d.data()}));
    const qb=query(collection(db,'circles'),where('parentB','==',uid));
    (await getDocs(qb)).docs.forEach(d=>{if(!S.circles.find(c=>c.id===d.id))S.circles.push({id:d.id,data:d.data()});});
  }catch(e){}
}

async function logAdminConn(){
  try{
    const now=new Date();
    const dk=now.toISOString().split('T')[0];
    const mk=dk.substring(0,7);
    const hr=String(now.getHours()).padStart(2,'0');
    const yr=now.getFullYear();
    const ref=doc(db,'admin','stats');
    const sn=await getDoc(ref);
    const d=sn.exists()?sn.data():{total:0,byDay:{},byMonth:{},byYear:{},byHour:{}};
    d.total=(d.total||0)+1;
    d.byDay=d.byDay||{};d.byDay[dk]=(d.byDay[dk]||0)+1;
    d.byMonth=d.byMonth||{};d.byMonth[mk]=(d.byMonth[mk]||0)+1;
    d.byYear=d.byYear||{};d.byYear[yr]=(d.byYear[yr]||0)+1;
    d.byHour=d.byHour||{};d.byHour[hr]=(d.byHour[hr]||0)+1;
    d.lastLogin=serverTimestamp();
    await setDoc(ref,d);S.adminStats=d;
  }catch(e){}
}

function startL(){
  if(!S.cid)return;S.uns.forEach(u=>u());S.uns=[];
  ['exchanges','expenses','tasks','docs','contacts','memories','notifs','members','events','children'].forEach(col=>{

      const u=onSnapshot(q,sn=>{S.d[col]=sn.docs.map(d=>({id:d.id,...d.data()}));renderS(S.screen);updNB();},
      ()=>{const u2=onSnapshot(collection(db,'circles',S.cid,col),sn=>{S.d[col]=sn.docs.map(d=>({id:d.id,...d.data()}));renderS(S.screen);updNB();});S.uns.push(u2);});
      S.uns.push(u);
    }catch(e){}
  });

function getG(k){
  const plan=S.cd?.planning;
  if(plan?.type&&plan?.startDate&&plan?.startParent)return computeG(k,plan);
  const d=new Date(k+'T00:00:00');const wd=d.getDay();
  const wn=Math.floor((d-new Date(2026,0,1))/(7*24*3600*1000));
  if(wd===5)return'T';return wn%2===0?'A':'B';
}
function isoWeekNum(d){const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-dn+3);const fT=new Date(Date.UTC(dt.getUTCFullYear(),0,4));return 1+Math.round(((dt-fT)/86400000-3+((fT.getUTCDay()+6)%7))/7);}
function inHolidayPeriod(d,plan){
  if(!plan.holiday?.enabled||!plan.holiday?.start||!plan.holiday?.end)return null;
  const hs=new Date(plan.holiday.start+'T00:00:00'),he=new Date(plan.holiday.end+'T00:00:00');
  if(d<hs||d>he)return null;
  const wk=isoWeekNum(d);const isEven=wk%2===0;
  return isEven?plan.holiday.evenParent:(plan.holiday.evenParent==='A'?'B':'A');
}
function computeG(k,plan){
  const d=new Date(k+'T00:00:00');const s=new Date(plan.startDate+'T00:00:00');
  const diff=Math.round((d-s)/(24*3600*1000));if(diff<0)return'?';
  const sp=plan.startParent;const op=sp==='A'?'B':'A';const wd=d.getDay();let g;
  const hol=inHolidayPeriod(d,plan);if(hol)return hol;
  if(plan.type==='1s2'){const wk=Math.floor(diff/7);g=wk%2===0?sp:op;}
  else if(plan.type==='223'){const wk=Math.floor(diff/7);const ep=wk%2===0?sp:op;const op2=ep==='A'?'B':'A';if(wd===5)return'T';if(wd===1||wd===2)g=ep;else if(wd===3||wd===4)g=op2;else g=ep;}
  else if(plan.type==='2253'){const pos=diff%14;if(wd===5&&(pos===4||pos===9))return'T';if(pos<2)g=sp;else if(pos<4)g=op;else if(pos<9)g=sp;else g=op;}
  else if(plan.type==='1we2'){const wk=Math.floor(diff/7);if(wd===5)return'T';if(wd===0||wd===6)g=wk%2===0?sp:op;else g=sp;}
  else if(plan.type==='custom'&&Array.isArray(plan.cycle)&&plan.cycle.length>0){
    const total=plan.cycle.reduce((s2,b)=>s2+(parseInt(b.days)||0),0)||1;
    let pos=((diff%total)+total)%total;
    let acc=0;g=sp;
    for(const b of plan.cycle){const days=parseInt(b.days)||0;if(pos<acc+days){g=b.parent==='start'?sp:(b.parent==='other'?op:b.parent);break;}acc+=days;}
  }
  else{const wk=Math.floor(diff/7);g=wk%2===0?sp:op;}
  return g||'A';
}
window.getG=getG;

window.goBack=function(){const prev=S.history.pop();if(prev){const cur=S.screen;S.screen=prev;go(prev);S.history=S.history.filter(h=>h!==cur);}else go('home');};

function renderS(s){
  const c=document.getElementById('content');if(!c)return;
  const fn={home:rH,agenda:rA,exchange:rE,budget:rB,tasks:rT,docs:rD,directory:rDI,memories:rM,notifs:rN,profile:rPR,settings:rST,planning:rPL,admin:rAdmin};
  if(fn[s])c.innerHTML=fn[s]();
}

window.toast=function(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('tc').appendChild(t);setTimeout(()=>t.remove(),2700);};
window.openModal=function(html){closeModal();const ov=document.createElement('div');ov.className='mov';ov.id='am';ov.innerHTML=`<div class="msh"><div class="mhd"></div>${html}</div>`;ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});document.getElementById('mc').appendChild(ov);};

window.doRegister=async function(){
  const prenom=document.getElementById('rprenom').value.trim();
  const nom=document.getElementById('rnom').value.trim();
  const email=document.getElementById('re').value.trim();
  const telephone=document.getElementById('rtel')?.value?.trim()||'';
  const pwd=document.getElementById('rp').value;
  const role=document.getElementById('rr').value;
  let ok=true;
  if(!prenom){document.getElementById('err-prenom').classList.add('show');ok=false;}else document.getElementById('err-prenom').classList.remove('show');
  if(!nom){document.getElementById('err-nom').classList.add('show');ok=false;}else document.getElementById('err-nom').classList.remove('show');
  const reEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!reEmail.test(email)){document.getElementById('err-email').classList.add('show');document.getElementById('re').classList.add('fi-err');ok=false;}else{document.getElementById('err-email').classList.remove('show');document.getElementById('re').classList.remove('fi-err');}
  if(pwd.length<6){document.getElementById('err-pwd').classList.add('show');ok=false;}else document.getElementById('err-pwd').classList.remove('show');
  if(!ok)return;
  const btn=document.getElementById('rbtn'),err=document.getElementById('rerr');
  btn.disabled=true;btn.textContent='Création...';err.innerHTML='';
  try{
    const methods=await fetchSignInMethodsForEmail(auth,email);
    if(methods.length>0){err.innerHTML='<div class="emsg">Cette adresse email est déjà utilisée</div>';btn.disabled=false;btn.textContent='Créer mon compte';return;}
    const c=await createUserWithEmailAndPassword(auth,email,pwd);
    const name=`${prenom} ${nom}`;
    await updateProfile(c.user,{displayName:name});
    await setDoc(doc(db,'users',c.user.uid),{prenom,nom,name,email,telephone,role,pushEnabled:false,createdAt:serverTimestamp()});
    S.prof={prenom,nom,name,email,telephone,role,pushEnabled:false};
    showMain();toast('✅ Compte créé !');go('profile');
  }catch(e2){
    if(e2.code==='auth/email-already-in-use')err.innerHTML='<div class="emsg">Cette adresse email est déjà utilisée</div>';
    else if(e2.code==='auth/invalid-email')err.innerHTML='<div class="emsg">Adresse email incorrecte</div>';
    else err.innerHTML=`<div class="emsg">${e2.message}</div>`;
    btn.disabled=false;btn.textContent='Créer mon compte';
  }
};

async function initPush(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    const perm=await Notification.requestPermission();
    if(perm==='granted'){
      const msg=getMessaging(fba);
      const token=await getToken(msg,{vapidKey:VAPID,serviceWorkerRegistration:reg});
      if(token&&S.user)await updateDoc(doc(db,'users',S.user.uid),{fcmToken:token,tokenUpdated:serverTimestamp()});
      onMessage(msg,payload=>{toast(`🔔 ${payload.notification?.title||''}: ${payload.notification?.body||''}`);});
    }
  }catch(e){}
}
window.initPush=initPush;

function compress(file,maxW=800,q=0.7){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=h*(maxW/w);w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.src=e.target.result;};r.readAsDataURL(file);});}
window.compress=compress;

function addToGCal(title,date,time,desc){const dt=date.replace(/-/g,'');const s=time?`${dt}T${time.replace(':','')}00`:dt;const e2=time?`${dt}T${(parseInt(time.split(':')[0])+1).toString().padStart(2,'0')}${time.split(':')[1]}00`:dt;window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${s}/${e2}&details=${encodeURIComponent(desc||'SJ Family')}`,'_blank');}

let curPay='A';
window.archiveExp=async function(id){await upd('expenses',id,{archived:true,archivedAt:serverTimestamp()});toast('✅ Dépense archivée');};
document.addEventListener('click',e=>{const t=e.target.closest('.receipt-thumb');if(t){openModal('<div class=\"mtt\">Justificatif</div><img src=\"'+t.src+'\" style=\"width:100%;border-radius:12px\">');}});
window.selPay=function(p){curPay=p;['A','B'].forEach(x=>{const el=document.getElementById(`ep${x}`);if(el){el.style.borderColor=x===p?'var(--p)':'var(--gl)';el.style.background=x===p?'rgba(10,61,107,.08)':'var(--gu)';}});};
window.splitFromPct=function(v){
  document.getElementById('spv').textContent=v;document.getElementById('spv2').textContent=100-v;
  const tot=parseFloat(document.getElementById('expa')?.value)||0;
  document.getElementById('expma').value=(tot*v/100).toFixed(2);
  document.getElementById('expmb').value=(tot*(100-v)/100).toFixed(2);
};
window.splitFromAmt=function(p,v){
  const tot=parseFloat(document.getElementById('expa')?.value)||0;if(tot<=0)return;
  const amt=parseFloat(v)||0;const pct=Math.round((amt/tot)*100);
  const pctA=p==='A'?pct:100-pct;
  document.getElementById('exps').value=pctA;document.getElementById('spv').textContent=pctA;document.getElementById('spv2').textContent=100-pctA;
  const other=p==='A'?'expmb':'expma';
  document.getElementById(other).value=(tot-amt).toFixed(2);
};
window.prevPhoto=async function(input){if(input.files&&input.files[0]){const b64=await compress(input.files[0]);const prev=document.getElementById('photo-preview');if(prev){prev.src=b64;prev.classList.add('show');}}};
window.subExp=async function(){
  if(!S.cid){toast('❌ Configurez votre cercle');return;}
  const label=document.getElementById('expl')?.value?.trim(),amount=document.getElementById('expa')?.value,
    category=document.getElementById('expc')?.value,split=document.getElementById('exps')?.value||50;
  if(!label||!amount){toast('❌ Remplissez tous les champs');return;}
  const pf=document.getElementById('exp-pf'),pc=document.getElementById('exp-pc');
  let photoBase64=null;
  const ai=pc?.files?.length>0?pc:pf;
  if(ai?.files&&ai.files[0]){toast('⏳ Compression...');photoBase64=await compress(ai.files[0],600,0.6);}
  await add('expenses',{label,amount:parseFloat(amount),category,paidByParent:curPay,split:parseInt(split),date:new Date().toISOString().split('T')[0],photoBase64});
  await notif(`Nouvelle dépense : ${label} ${parseFloat(amount).toFixed(2)}€`,'💰');

};

function fmtDT(ts){
  if(!ts)return'à l\'instant';
  const d=ts.toDate?ts.toDate():new Date(ts);
  const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=d.getFullYear();
  const hh=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} à ${hh}h${mi}`;
}

    const msnap=await getDocs(collection(db,'circles',code,'members'));
    let matched=null;
    msnap.docs.forEach(d=>{const md=d.data();if(md.status==='pending'&&((md.inviteEmail&&md.inviteEmail===S.user.email)||(md.invitePhone&&S.prof?.telephone&&md.invitePhone.replace(/\s/g,'')===S.prof.telephone.replace(/\s/g,''))))matched=d;});
    if(matched)await updateDoc(doc(db,'circles',code,'members',matched.id),{uid:S.user.uid,name:fullName(),status:'active',joinedAt:serverTimestamp()});
    else await addDoc(collection(db,'circles',code,'members'),{name:fullName(),uid:S.user.uid,role:'Proche',status:'active',addedByParent:null,addedByParentName:null,createdBy:S.user.uid,createdByName:fullName(),createdAt:serverTimestamp()});
  }else{
    await updateDoc(doc(db,'circles',code),{parentB:S.user.uid,parentBName:fullName(),parentBEmail:S.user.email});
  }
  try{await updateDoc(doc(db,'users',S.user.uid),{lastCircleId:code});}catch(e){}
  const existing=S.circles.find(c=>c.id===code);
  if(!existing)S.circles.push({id:code,data:{...sn.data(),parentB:S.user.uid,parentBName:fullName()}});
  S.cid=code;S.cd={...sn.data(),parentB:S.user.uid,parentBName:fullName()};
  startL();toast('✅ Cercle rejoint !');go('home');}catch(e){toast('❌ Erreur : '+e.message);}
};
window.selStatusUI=function(v){window._pendStCh=v;renderS(S.screen);};
window.requestSt=async function(value){
  if(!S.cid)return;
  const other=isPA()?pbN():paN();
  await updateDoc(doc(db,'circles',S.cid),{pendingStatus:{value,requestedBy:S.user.uid,requestedByName:fullName(),requestedAt:serverTimestamp()}});
  S.cd.pendingStatus={value,requestedBy:S.user.uid,requestedByName:fullName()};
  await notif(`Demande de changement de statut : ${stLbl(value)} (en attente de validation)`,'💑');
  window._pendStCh=null;toast(`✅ Demande envoyée à ${other} pour validation`);renderS(S.screen);
};
window.approveSt=async function(){
  if(!S.cid||!S.cd?.pendingStatus)return;
  const value=S.cd.pendingStatus.value;
  await updateDoc(doc(db,'circles',S.cid),{status:value,pendingStatus:null});
  S.cd.status=value;S.cd.pendingStatus=null;
  const i=S.circles.findIndex(c=>c.id===S.cid);if(i>=0){S.circles[i].data.status=value;S.circles[i].data.pendingStatus=null;}
  await notif(`Statut validé : ${stLbl(value)}`,'💑');toast('✅ Statut validé');renderS(S.screen);
};
window.rejectSt=async function(){
  if(!S.cid)return;
  await updateDoc(doc(db,'circles',S.cid),{pendingStatus:null});
  S.cd.pendingStatus=null;
  await notif(`Demande de changement de statut refusée`,'💑');toast('Demande refusée');renderS(S.screen);
};
window.cpCode=function(){navigator.clipboard.writeText(S.cid).then(()=>toast('✅ Code copié !')).catch(()=>{const el=document.createElement('textarea');el.value=S.cid;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast('✅ Code copié !');});};
window.invM=function(){if(!isP()){toast('❌ Réservé aux parents');return;}openModal(`<div class="mtt">➕ Inviter un proche</div>
  <div class="fg"><label class="fl">Prénom</label><input class="fi" id="imn"/></div>
  <div class="fg"><label class="fl">Rôle</label><input class="fi" id="imr" placeholder="Ex: Grand-mère, Tonton..."/></div>
  <div class="fg"><label class="fl">Email (optionnel)</label><input class="fi" type="email" id="ime"/></div>
  <div class="fg"><label class="fl">Téléphone (optionnel)</label><input class="fi" type="tel" id="imt" placeholder="06 12 34 56 78"/></div>
  <button class="bp" onclick="subIM()">Inviter</button>`);};
window.subIM=async function(){
  const n=document.getElementById('imn')?.value?.trim(),r=document.getElementById('imr')?.value?.trim();
  const e=document.getElementById('ime')?.value?.trim(),t=document.getElementById('imt')?.value?.trim();
  if(!n){toast('❌ Entrez un prénom');return;}
  const ref=await addDoc(collection(db,'circles',S.cid,'members'),{name:n,role:r,inviteEmail:e||null,invitePhone:t||null,status:'pending',addedByParent:isPA()?'A':'B',addedByParentName:fullName(),createdBy:S.user.uid,createdByName:fullName(),createdAt:serverTimestamp()});
  closeModal();
  const subject=encodeURIComponent('Invitation SJ Family');
  const body=encodeURIComponent(`Bonjour ${n},\n\n${fullName()} vous invite à rejoindre l'espace familial sur SJ Family.\n\n1) Téléchargez l'app : https://newboy7745.github.io/sj-family/\n2) Créez votre compte\n3) Rejoignez le cercle avec ce code : ${S.cid}\n\nÀ bientôt !`);
  let html='<div class="mtt">✅ Proche ajouté</div><div style="font-size:12px;color:var(--gr);margin-bottom:12px">Envoyez-lui maintenant l\'invitation :</div>';
  if(e)html+=`<a href="mailto:${e}?subject=${subject}&body=${body}" class="bp" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px">📧 Envoyer par email</a>`;
  if(t)html+=`<a href="sms:${t.replace(/\s/g,'')}?body=${body}" class="bo" style="display:block;text-align:center;text-decoration:none">💬 Envoyer par SMS</a>`;
  if(!e&&!t)html+='<div style="font-size:12px;color:var(--gr)">Partagez-lui simplement le code du cercle.</div>';
  openModal(html);
};

// ════ SETTINGS ════
function rST(){
  const prof=S.prof;
  return`<div style="padding:13px 18px 0">
  <div class="card"><div class="ctt">👤 Informations personnelles</div>
    <div class="fg"><label class="fl">Prénom</label><input class="fi" id="st-p" value="${prof?.prenom||''}"/></div>
    <div class="fg"><label class="fl">Nom</label><input class="fi" id="st-n" value="${prof?.nom||''}"/></div>
    <div class="fg"><label class="fl">Téléphone</label><input class="fi" type="tel" id="st-tel" value="${prof?.telephone||''}" placeholder="06 12 34 56 78"/></div>
    <div style="font-size:11px;color:var(--gr);margin-bottom:10px">Email : ${prof?.email||S.user?.email||''}</div>
    <button class="bp bsm" onclick="saveProf()">💾 Enregistrer</button>
  </div>
  <div class="card"><div class="ctt">🔔 Notifications push</div>
    <div class="sr">
      <div><div style="font-weight:700;font-size:13px">Recevoir les notifications</div><div style="font-size:11px;color:var(--gr)">Alertes même app fermée</div></div>
      <button class="tgl ${(window._pendPush??prof?.pushEnabled)?'on':'off'}" onclick="togPushUI(this)"></button>
    </div>
    <div style="font-size:11px;color:var(--gr);margin-top:8px">${(window._pendPush??prof?.pushEnabled)?'✅ Activées — vous recevrez une alerte à chaque changement.':'❌ Désactivées.'}</div>
    ${(window._pendPush!==undefined&&window._pendPush!==!!prof?.pushEnabled)?`<button class="bp bsm" style="margin-top:9px" onclick="savePush()">💾 Enregistrer</button>`:''}
  </div>
  <div class="card"><div class="ctt">⚙️ Raccourcis</div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Planning de garde</div></div><button class="bo bsm" onclick="go('planning')">Configurer</button></div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Mon cercle</div></div><button class="bo bsm" onclick="go('profile')">Gérer</button></div>
    ${S.isAdmin?`<div class="sr"><div><div style="font-weight:700;font-size:13px">Administration</div></div><button class="bo bsm" onclick="go('admin')">Accéder</button></div>`:''}
  </div>
  <button class="bo" style="margin-bottom:8px" onclick="doLogout()">🚪 Se déconnecter</button>
  <button class="bdanger" onclick="deleteAccount()">🗑 Supprimer mon compte</button>
  <div style="height:16px"></div></div>`;
}
window.saveProf=async function(){
  const prenom=document.getElementById('st-p')?.value?.trim(),nom=document.getElementById('st-n')?.value?.trim();
  const telephone=document.getElementById('st-tel')?.value?.trim()||'';
  if(!prenom||!nom){toast('❌ Prénom et nom requis');return;}
  const name=`${prenom} ${nom}`;
  try{
    await updateDoc(doc(db,'users',S.user.uid),{prenom,nom,name,telephone});
    await updateProfile(S.user,{displayName:name});
    S.prof={...S.prof,prenom,nom,name,telephone};
    if(S.cid){if(isPA())await updateDoc(doc(db,'circles',S.cid),{parentAName:name});else await updateDoc(doc(db,'circles',S.cid),{parentBName:name});}
    toast('✅ Profil mis à jour !');renderS(S.screen);
  }catch(e){toast('❌ Erreur : '+e.message);}
};
window.togPushUI=function(btn){window._pendPush=!(window._pendPush??S.prof?.pushEnabled);renderS(S.screen);};
window.savePush=async function(){
  const enabled=!!window._pendPush;
  try{await updateDoc(doc(db,'users',S.user.uid),{pushEnabled:enabled});}catch(e){}
  S.prof={...S.prof,pushEnabled:enabled};
  window._pendPush=undefined;
  if(enabled){await initPush();toast('✅ Notifications activées !');}else toast('Notifications désactivées');
  renderS(S.screen);
};
window.renderS=renderS;
</script>

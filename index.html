<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="SJ Family"/>
<meta name="theme-color" content="#0D4F7C"/>
<title>SJ Family</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap');
:root{--p:#0A3D6B;--pl:#1558A0;--g:#C9A84C;--gl2:#E2C97E;--co:#E8735A;--cl:#F08070;--sa:#6BAF92;--sd:#3D8A62;--lv:#9B8EC4;--ld:#6B5FA0;--bg:#F5F7FA;--dk:#0A1628;--gr:#5A6478;--gl:#DDE2EA;--gu:#EEF1F6;--pa:#E8735A;--pb:#1558A0;--r:18px;--sh:0 2px 16px rgba(10,22,40,0.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#1A2332;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,0.4)}
#splash{position:absolute;inset:0;background:linear-gradient(160deg,#F8F9FF 0%,#EEF2FF 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
.spc{width:150px;height:150px;border-radius:50%;border:2px solid var(--g);display:flex;align-items:center;justify-content:center;animation:sin .8s ease both}
@keyframes sin{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.spf{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:600;color:var(--p);letter-spacing:4px}
.spt{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--p);letter-spacing:6px;margin-top:20px;animation:sin .8s ease .2s both}
.sps{font-size:10px;font-weight:700;color:var(--gr);letter-spacing:3px;text-transform:uppercase;margin-top:5px;animation:sin .8s ease .4s both}
#auth{flex:1;overflow-y:auto;padding:32px 22px;display:none;flex-direction:column}
#auth.show{display:flex}
.al{text-align:center;margin-bottom:24px}
.ac{width:70px;height:70px;border-radius:50%;border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 9px}
.af{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--p);letter-spacing:2px}
.an{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--p);letter-spacing:4px;font-weight:600}
.as2{font-size:10px;color:var(--gr);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
#main{flex:1;display:none;flex-direction:column;overflow:hidden}
#main.show{display:flex}
.tb{background:var(--p);padding:13px 15px 11px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tbl{display:flex;align-items:center;gap:7px}
.tbc{width:28px;height:28px;border-radius:50%;border:1px solid var(--g);display:flex;align-items:center;justify-content:center}
.tbf{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;color:white;letter-spacing:1px}
.tbn{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:white;letter-spacing:2px}
.tba{display:flex;gap:6px}
.ib{width:31px;height:31px;background:rgba(255,255,255,.15);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;position:relative;transition:background .2s}
.ib:hover{background:rgba(255,255,255,.25)}
.nb{position:absolute;top:0;right:0;width:13px;height:13px;border-radius:7px;background:var(--co);font-size:8px;font-weight:900;color:white;display:flex;align-items:center;justify-content:center}
.sct{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:white;letter-spacing:1px}
.ct{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.ct::-webkit-scrollbar{display:none}
.bn{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gl);display:flex;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,0.08)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 0;border:none;background:none}
.nw{padding:3px 9px;border-radius:9px}
.ni.active .nw{background:rgba(13,79,124,.1)}
.nico{font-size:18px;line-height:1}
.nlb{font-size:10px;font-weight:700;color:var(--gr);font-family:'Nunito',sans-serif}
.ni.active .nlb{color:var(--p)}
.ncb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer}
.ncc{width:42px;height:42px;background:linear-gradient(135deg,var(--co),var(--g));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;margin-top:-13px;box-shadow:0 4px 14px rgba(232,115,90,.4)}
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:800;color:var(--dk);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi,.fs,.fta{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--gl);font-family:'Nunito',sans-serif;font-size:14px;color:var(--dk);background:var(--gu);outline:none;transition:border .2s;-webkit-appearance:none}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--pl);background:white}
.fta{resize:none;height:72px}
.bp{background:linear-gradient(135deg,var(--p),var(--pl));color:white;border:none;border-radius:12px;padding:13px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;width:100%;box-shadow:0 4px 14px rgba(13,79,124,.28);transition:opacity .2s,transform .15s}
.bp:hover{opacity:.92;transform:translateY(-1px)}
.bp:disabled{opacity:.5;cursor:not-allowed;transform:none}
.bc{background:linear-gradient(135deg,var(--co),var(--cl));color:white;border:none;border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;width:100%}
.bo{background:transparent;color:var(--p);border:2px solid var(--p);border-radius:12px;padding:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;width:100%}
.bsm{padding:7px 12px;font-size:12px;border-radius:9px;width:auto}
.bgold{background:linear-gradient(135deg,var(--g),var(--gl2));color:white;border:none;border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;width:100%}
.card{background:white;border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:11px}
.ctt{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--dk);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bco{background:rgba(232,115,90,.15);color:var(--co)}
.bpe{background:rgba(27,108,168,.15);color:var(--pl)}
.bgo{background:rgba(201,168,76,.15);color:#8B6914}
.bsa{background:rgba(107,175,146,.15);color:var(--sd)}
.bgr{background:rgba(16,185,129,.15);color:#059669}
.bre{background:rgba(239,68,68,.15);color:#DC2626}
.bgr2{background:var(--gu);color:var(--gr)}
.blv{background:rgba(155,142,196,.15);color:var(--ld)}
.tabs{display:flex;border-bottom:2px solid var(--gl);margin-bottom:13px}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--gr);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:'Nunito',sans-serif}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gu);cursor:pointer}
.li:last-child{border-bottom:none}
.lii{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lic{flex:1;min-width:0}
.lit{font-size:13px;font-weight:700;color:var(--dk)}
.lis{font-size:11px;color:var(--gr);margin-top:1px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.caldn{text-align:center;font-size:10px;font-weight:800;color:var(--gr);padding:4px 0;text-transform:uppercase;letter-spacing:.3px}
.cald{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;transition:all .15s;position:relative}
.cald.om{color:rgba(107,114,128,.25)}
.cald.tod{background:var(--p);color:white}
.cald.dpa{background:rgba(232,115,90,.22);color:var(--co)}
.cald.dpb{background:rgba(27,108,168,.22);color:var(--pl)}
.cald.dtr{background:rgba(201,168,76,.28);color:#8B6914;border:2px solid var(--g)}
.cald.dpnd{border:2px dashed var(--lv)}
.cald.dhol{color:var(--sd);font-weight:900}
.cald.dev::after{content:'';position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--co)}
.exc{background:white;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);border-left:4px solid var(--g)}
.exc.accepted{border-left-color:var(--sa)}.exc.refused{border-left-color:var(--co)}.exc.pending{border-left-color:var(--lv)}
.tck{width:20px;height:20px;border-radius:7px;border:2px solid var(--gl);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.tck.done{background:var(--sa);border-color:var(--sa);color:white}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.msh{background:white;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:6px 18px 28px;max-height:88vh;overflow-y:auto;animation:su .3s ease}
.msh::-webkit-scrollbar{display:none}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhd{width:36px;height:4px;background:var(--gl);border-radius:2px;margin:10px auto 15px}
.mtt{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;margin-bottom:15px;color:var(--dk)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--dk);color:white;padding:10px 17px;border-radius:12px;font-size:13px;font-weight:700;z-index:500;animation:ti .3s ease,to .3s ease 2.2s forwards;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px}
@keyframes ti{from{opacity:0;top:56px}to{opacity:1;top:70px}}@keyframes to{to{opacity:0}}
.sec{padding:16px 18px 9px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--dk)}
.info{background:rgba(13,79,124,.07);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--p);font-weight:600;margin-bottom:12px;border-left:3px solid var(--p)}
.warn{background:rgba(201,168,76,.1);border-radius:12px;padding:10px 12px;font-size:12px;color:#8B6914;font-weight:600;margin-bottom:12px;border-left:3px solid var(--g)}
.emsg{color:#DC2626;font-size:12px;font-weight:700;text-align:center;margin-top:7px;padding:8px;background:#FEF2F2;border-radius:9px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:justify-content;justify-content:center;font-weight:900;color:white;flex-shrink:0}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.ht{background:white;border-radius:var(--r);padding:15px 12px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px}
.ht:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.11)}
.hti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.htl{font-size:13px;font-weight:800;color:var(--dk);line-height:1.2}
.hts{font-size:11px;color:var(--gr)}
.row{display:flex;align-items:center}
.rowb{display:flex;align-items:center;justify-content:space-between}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.f1{flex:1}
.sx{overflow-x:auto;white-space:nowrap;display:flex;gap:6px;padding-bottom:3px}
.sx::-webkit-scrollbar{display:none}
.tgl{width:42px;height:23px;border-radius:12px;position:relative;cursor:pointer;border:none;flex-shrink:0;transition:background .2s}
.tgl.on{background:var(--p)}.tgl.off{background:var(--gl)}
.tgl::after{content:'';position:absolute;top:2px;width:17px;height:17px;border-radius:50%;background:white;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tgl.on::after{left:22px}.tgl.off::after{left:3px}
.cm{display:flex;align-items:center;gap:9px;padding:10px;background:var(--gu);border-radius:12px;margin-bottom:9px}
.sto{flex:1;min-width:66px;padding:9px 5px;border-radius:12px;border:2px solid var(--gl);background:var(--gu);text-align:center;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:var(--gr);transition:all .2s}
.sto.sel{border-color:var(--p);background:rgba(13,79,124,.08);color:var(--p)}
.pw{display:flex;gap:3px}
.pd{flex:1;border-radius:8px;padding:7px 2px;text-align:center;font-size:10px;font-weight:800}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.mo{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:8px 8px 7px;color:white}
.ni2{display:flex;align-items:flex-start;gap:9px;padding:12px;background:white;border-radius:14px;margin-bottom:9px;box-shadow:0 1px 6px rgba(0,0,0,.05);position:relative}
.nd{position:absolute;top:14px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--co)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gu)}
.sr:last-child{border-bottom:none}
.di{display:flex;align-items:center;gap:10px;padding:10px;background:white;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.cc2{background:white;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.er{display:flex;align-items:center;gap:9px;padding:10px;background:var(--gu);border-radius:12px;margin-bottom:8px}
/* CIRCLE SELECTOR */
.circ-card{background:white;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);border:2px solid transparent;cursor:pointer;transition:all .2s}
.circ-card.active{border-color:var(--p);background:rgba(13,79,124,.04)}
/* PHOTO PREVIEW */
.photo-prev{width:100%;height:140px;border-radius:12px;object-fit:cover;margin-top:8px;display:none}
.photo-prev.show{display:block}
/* NOTIF PERMISSION BANNER */
.notif-banner{background:linear-gradient(135deg,var(--p),var(--pl));border-radius:14px;padding:13px;margin:0 18px 12px;color:white;display:flex;align-items:center;gap:10px}

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import{getMessaging,getToken,onMessage}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const FB={apiKey:"AIzaSyDlyQZ-O5Xuko-jtIvhJSzlncg1eL9Icdg",authDomain:"sj-family-dd337.firebaseapp.com",projectId:"sj-family-dd337",storageBucket:"sj-family-dd337.firebasestorage.app",messagingSenderId:"738819968953",appId:"1:738819968953:web:0f33908b97092bee20b068"};
const fba=initializeApp(FB);
const auth=getAuth(fba);
const db=getFirestore(fba);
const VAPID_KEY="BOb9HgEgDId8Rn4fc3_Its_qyroRFO2UD7dM0TesmkCpKOc-2xiYZtM432D8RBT_9przQbgKFl1wnob_IfMQ0uE";

// ── STATE ──
const S={
  user:null,prof:null,
  circles:[],       // all circles user belongs to
  cid:null,         // current active circle id
  cd:null,          // current circle data
  screen:'home',
  cy:new Date().getFullYear(),cm:new Date().getMonth(),
  uns:[],
  d:{exchanges:[],expenses:[],tasks:[],shopping:[],docs:[],contacts:[],memories:[],notifs:[],members:[],events:[]}
};
const MN=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DN=["L","M","M","J","V","S","D"];
const FH={"2026-01-01":"Jour de l'an","2026-04-06":"Lundi de Pâques","2026-05-01":"Fête du Travail","2026-05-08":"Victoire 1945","2026-05-14":"Ascension","2026-05-25":"Pentecôte","2026-07-14":"Fête Nationale","2026-08-15":"Assomption","2026-11-01":"Toussaint","2026-11-11":"Armistice","2026-12-25":"Noël"};
Object.assign(window,{S,auth,db,doc,setDoc,getDoc,collection,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp,getDocs,where,signOut,MN,DN,FH});

// ── AUTH STATE ──
onAuthStateChanged(auth,async u=>{
  const sp=document.getElementById('splash');sp.classList.add('hide');setTimeout(()=>sp.style.display='none',700);
  if(u){S.user=u;await loadProf(u.uid);showMain();}
  else{S.user=null;S.prof=null;S.cid=null;showAuth();}
});

async function loadProf(uid){
  const sn=await getDoc(doc(db,'users',uid));
  if(sn.exists()){S.prof=sn.data();}
  // Load all circles user belongs to
  await loadUserCircles(uid);
  if(S.circles.length>0){
    S.cid=S.prof?.lastCircleId||S.circles[0].id;
    S.cd=S.circles.find(c=>c.id===S.cid)?.data||S.circles[0].data;
    startL();
  }
}
window.loadProf=loadProf;

async function loadUserCircles(uid){
  S.circles=[];
  // Circles where user is parentA
  const qa=query(collection(db,'circles'),where('parentA','==',uid));
  const sna=await getDocs(qa);
  sna.docs.forEach(d=>S.circles.push({id:d.id,data:d.data()}));
  // Circles where user is parentB
  const qb=query(collection(db,'circles'),where('parentB','==',uid));
  const snb=await getDocs(qb);
  snb.docs.forEach(d=>{if(!S.circles.find(c=>c.id===d.id))S.circles.push({id:d.id,data:d.data()});});
  if(S.circles.length>0&&!S.cid)S.cid=S.circles[0].id;
  if(S.cid){const c=S.circles.find(x=>x.id===S.cid);if(c)S.cd=c.data;}
}
window.loadUserCircles=loadUserCircles;

function showMain(){document.getElementById('auth').classList.remove('show');document.getElementById('main').classList.add('show');initPush();go('home');}
function showAuth(){document.getElementById('main').classList.remove('show');document.getElementById('auth').classList.add('show');}

// ── PUSH NOTIFICATIONS ──
async function initPush(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return;
  try{
    // Register SW
    const swContent=`
importScripts('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
importScripts('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js');
firebase.initializeApp({apiKey:"AIzaSyDlyQZ-O5Xuko-jtIvhJSzlncg1eL9Icdg",authDomain:"sj-family-dd337.firebaseapp.com",projectId:"sj-family-dd337",storageBucket:"sj-family-dd337.firebasestorage.app",messagingSenderId:"738819968953",appId:"1:738819968953:web:0f33908b97092bee20b068"});
const messaging=firebase.messaging();
messaging.onBackgroundMessage(payload=>{
  self.registration.showNotification(payload.notification?.title||'SJ Family',{body:payload.notification?.body||'',icon:'/icon-192.png',badge:'/icon-192.png',data:payload.data});
});
self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.openWindow('/'));});
const CACHE='sjf-v4';
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['.']).catch(()=>{}))));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
self.addEventListener('fetch',e=>{if(e.request.url.includes('firebase')||e.request.url.includes('googleapis')||e.request.url.includes('gstatic'))return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});
`;
    const blob=new Blob([swContent],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    const reg=await navigator.serviceWorker.register(swUrl);
    await navigator.serviceWorker.ready;

    // Request permission
    const perm=await Notification.requestPermission();
    if(perm==='granted'){
      try{
        const messaging=getMessaging(fba);
        const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
        if(token&&S.user){
          await updateDoc(doc(db,'users',S.user.uid),{fcmToken:token,tokenUpdated:serverTimestamp()});
        }
        // Handle foreground messages
        onMessage(messaging,payload=>{
          toast(`🔔 ${payload.notification?.title||'SJ Family'}: ${payload.notification?.body||''}`);
        });
      }catch(e){console.log('FCM token error:',e);}
    }
  }catch(e){console.log('Push init error:',e);}
}

// ── LISTENERS ──
function startL(){
  if(!S.cid)return;S.uns.forEach(u=>u());S.uns=[];
  ['exchanges','expenses','tasks','shopping','docs','contacts','memories','notifs','members','events'].forEach(col=>{
    try{
      const q=query(collection(db,'circles',S.cid,col),orderBy('createdAt','desc'));
      const u=onSnapshot(q,sn=>{S.d[col]=sn.docs.map(d=>({id:d.id,...d.data()}));renderS(S.screen);updNB();},
      ()=>{const u2=onSnapshot(collection(db,'circles',S.cid,col),sn=>{S.d[col]=sn.docs.map(d=>({id:d.id,...d.data()}));renderS(S.screen);updNB();});S.uns.push(u2);});
      S.uns.push(u);
    }catch(e){}
  });
  // Also listen to circle data changes
  const cu=onSnapshot(doc(db,'circles',S.cid),sn=>{if(sn.exists()){S.cd=sn.data();const idx=S.circles.findIndex(c=>c.id===S.cid);if(idx>=0)S.circles[idx].data=S.cd;renderS(S.screen);}});
  S.uns.push(cu);
}
window.startL=startL;
function updNB(){const n=S.d.notifs.filter(x=>!x.read).length;const el=document.getElementById('nb');if(el){el.textContent=n;el.style.display=n>0?'flex':'none';}}

// ── DB ──
async function add(col,data){if(!S.cid)return;await addDoc(collection(db,'circles',S.cid,col),{...data,createdBy:S.user.uid,createdByName:S.prof?.name||'',createdAt:serverTimestamp()});}
async function upd(col,id,data){if(!S.cid)return;await updateDoc(doc(db,'circles',S.cid,col,id),{...data,updatedAt:serverTimestamp()});}
async function del(col,id){if(!S.cid)return;await deleteDoc(doc(db,'circles',S.cid,col,id));}
async function notif(text,icon='🔔'){if(!S.cid)return;await add('notifs',{text,icon,read:false});}
window.add=add;window.upd=upd;window.del=del;window.notif=notif;

// ── AUTH ──
window.swAT=function(tab,btn){

// ── GUARDIAN ──
function getG(k){
  const plan=S.cd?.planning;
  if(plan?.type&&plan?.startDate&&plan?.startParent)return computeG(k,plan);
  const d=new Date(k+'T00:00:00');const wd=d.getDay();
  const wn=Math.floor((d-new Date(2026,0,1))/(7*24*3600*1000));
  if(wd===5)return'T';return wn%2===0?'A':'B';
}
function computeG(k,plan){
  const d=new Date(k+'T00:00:00');const s=new Date(plan.startDate+'T00:00:00');
  const diff=Math.round((d-s)/(24*3600*1000));if(diff<0)return'?';
  const sp=plan.startParent;const op=sp==='A'?'B':'A';const wd=d.getDay();let g;
  if(plan.type==='1s2'){const wk=Math.floor(diff/7);g=wk%2===0?sp:op;}
  else if(plan.type==='223'){const wk=Math.floor(diff/7);const ep=wk%2===0?sp:op;const op2=ep==='A'?'B':'A';if(wd===5)return'T';if(wd===1||wd===2)g=ep;else if(wd===3||wd===4)g=op2;else g=ep;}
  else if(plan.type==='2253'){const pos=diff%14;if(wd===5&&(pos===4||pos===9))return'T';if(pos<2)g=sp;else if(pos<4)g=op;else if(pos<9)g=sp;else g=op;}
  else if(plan.type==='1we2'){const wk=Math.floor(diff/7);if(wd===5)return'T';if(wd===0||wd===6)g=wk%2===0?sp:op;else g=sp;}
  else{const wk=Math.floor(diff/7);g=wk%2===0?sp:op;}
  return g||'A';
}
window.getG=getG;

// ── TOAST / MODAL ──
window.toast=function(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('tc').appendChild(t);setTimeout(()=>t.remove(),2700);};
window.openModal=function(html){closeModal();const ov=document.createElement('div');ov.className='mov';ov.id='am';ov.innerHTML=`<div class="msh"><div class="mhd"></div>${html}</div>`;ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});document.getElementById('mc').appendChild(ov);};
window.closeModal=function(){document.getElementById('am')?.remove();};

// ── PHOTO HELPER (Base64) ──
function compressAndEncode(file,maxW=800,quality=0.7){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=h*(maxW/w);w=maxW;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
window.compressAndEncode=compressAndEncode;

window.addToGoogleCalendar=function(title,date,time,desc){
  const dt=date.replace(/-/g,'');
  const start=time?`${dt}T${time.replace(':','')}00`:`${dt}`;
  const end=time?`${dt}T${(parseInt(time.split(':')[0])+1).toString().padStart(2,'0')}${time.split(':')[1]}00`:`${dt}`;
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${end}&details=${encodeURIComponent(desc||'SJ Family')}`;
  window.open(url,'_blank');
};

function rA(){
  const y=S.cy,m=S.cm;
  const first=new Date(y,m,1).getDay();const off=first===0?6:first-1;
  const dim=new Date(y,m+1,0).getDate();const dip=new Date(y,m,0).getDate();
  const tod=new Date();let cells=[];
  for(let i=off-1;i>=0;i--)cells.push({d:dip-i,cur:false});
  for(let i=1;i<=dim;i++)cells.push({d:i,cur:true});
  while(cells.length<42)cells.push({d:cells.length-dim-off+1,cur:false});
  function cls(cell){
    if(!cell.cur)return'cald om';
    const d=new Date(y,m,cell.d);const k=`${y}-${String(m+1).padStart(2,'0')}-${String(cell.d).padStart(2,'0')}`;
    if(d.toDateString()===tod.toDateString())return'cald tod';
    if(S.d.exchanges.some(e=>e.date===k&&e.status==='pending'))return'cald dpnd';
    const g=S.cid?getG(k):'?';
    if(g==='T')return'cald dtr';if(g==='A')return'cald dpa';if(g==='B')return'cald dpb';return'cald';
  }
  const upc=S.d.events.filter(e=>{try{return new Date(e.date+'T00:00:00')>=tod;}catch{return false;}}).slice(0,4);
  const paN2=paN(),pbN2=pbN();
  return`<div style="padding:13px 18px 0">
  <div class="rowb" style="margin-bottom:12px">
    <button class="bo bsm" onclick="S.cy=${m===0?y-1:y};S.cm=${m===0?11:m-1};renderS('agenda')">‹</button>
    <div style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700">${MN[m]} ${y}</div>
    <button class="bo bsm" onclick="S.cy=${m===11?y+1:y};S.cm=${m===11?0:m+1};renderS('agenda')">›</button>
  </div>
  <div class="calg">
    ${DN.map(d=>`<div class="caldn">${d}</div>`).join('')}
    ${cells.map(cell=>{const k=`${y}-${String(m+1).padStart(2,'0')}-${String(cell.d).padStart(2,'0')}`;const hol=cell.cur&&FH[k];const hev=cell.cur&&S.d.events.some(e=>e.date===k);return`<button class="${cls(cell)}${hol?' dhol':''}${hev?' dev':''}" title="${hol||''}" onclick="if(${cell.cur})selDay('${k}')">${cell.d}</button>`;}).join('')}
  </div>
  <div class="rowb" style="margin-top:10px">
    <button class="bo bsm" onclick="tgLeg()">ℹ️ Légende</button>
    <div class="row g6"><span class="badge bco">${paN2}</span><span class="badge bpe">${pbN2}</span></div>
  </div>
  <div id="leg" style="display:none;margin-top:9px" class="card">
    ${[['dpa',`Garde ${paN2}`],['dpb',`Garde ${pbN2}`],['dtr','Transition'],['tod',"Aujourd'hui"],['dpnd','Échange en attente'],['dhol','Jours fériés']].map(([c,l])=>`<div class="row g10" style="margin-bottom:6px;font-size:12px"><div class="cald ${c}" style="width:22px;height:22px;border-radius:6px;flex-shrink:0;aspect-ratio:auto;cursor:default;font-size:10px">6</div>${l}</div>`).join('')}
  </div>
  ${S.cid&&isP()?`<button class="bo" style="margin-top:11px" onclick="addEvModal()">➕ Ajouter un événement</button>`:''}
  <div style="margin-top:15px">
    <div style="font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:700;margin-bottom:8px">Prochains événements</div>
    ${upc.length===0?`<div class="card" style="text-align:center;padding:18px;color:var(--gr)"><div style="font-size:30px;margin-bottom:7px">📅</div><div style="font-weight:700;font-size:12px">Aucun événement à venir</div></div>`
    :`<div class="card" style="margin:0">${upc.map(e=>`<div class="li">
      <div class="lii" style="background:rgba(13,79,124,.08)">${e.icon||'📅'}</div>
      <div class="lic"><div class="lit">${e.title}</div><div class="lis">${e.date||''} ${e.time?'à '+e.time:''}</div></div>
      <div class="row g6">
        <button onclick="addToGoogleCalendar('${e.title}','${e.date||''}','${e.time||''}','${e.category||''}')" style="background:rgba(66,133,244,.1);border:none;border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;color:#4285f4;font-weight:700">📅 GCal</button>

  S.cid=ref.id;S.cd={status,parentA:S.user.uid,parentAName:S.prof.name,childName:childN,planning:null};

window.jnCircle=async function(){
  const code=document.getElementById('jc')?.value?.trim();if(!code){toast('❌ Entrez un code');return;}

  await updateDoc(doc(db,'circles',code),{parentB:S.user.uid,parentBName:S.prof.name,parentBEmail:S.user.email});
  await updateDoc(doc(db,'users',S.user.uid),{lastCircleId:code});
  const existing=S.circles.find(c=>c.id===code);
  if(!existing)S.circles.push({id:code,data:{...sn.data(),parentB:S.user.uid,parentBName:S.prof.name}});
  S.cid=code;S.cd={...sn.data(),parentB:S.user.uid,parentBName:S.prof.name};
  startL();toast('✅ Cercle rejoint !');go('home');}catch(e){toast('❌ Erreur : '+e.message);}
};

  <div class="fg"><label class="fl">Rôle</label><input class="fi" id="imr" placeholder="Ex: Grand-mère maternelle"/></div>
  <button class="bp" onclick="subIM()">Inviter</button>`);};
window.subIM=async function(){const name=document.getElementById('imn')?.value?.trim(),role=document.getElementById('imr')?.value?.trim();if(!name){toast('❌ Entrez un prénom');return;}const p=isPA()?'A':'B';await add('members',{name,role,addedByParent:p,addedByParentName:S.prof?.name});toast('✅ Proche ajouté !');closeModal();};

// ════ SETTINGS ════
function rST(){const prof=S.prof;return`<div style="padding:13px 18px 0">
  <div class="card"><div class="ctt">👤 Mon compte</div>
    ${[['Nom',prof?.name||''],['Email',prof?.email||''],['Rôle',prof?.role==='parent'?'Parent':'Proche']].map(([l,v])=>`<div class="sr"><div><div style="font-weight:700;font-size:13px">${l}</div><div style="font-size:12px;color:var(--gr)">${v}</div></div></div>`).join('')}
  </div>
  <div class="card"><div class="ctt">🔔 Notifications push</div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Activer les notifications</div><div style="font-size:11px;color:var(--gr)">Même quand l'app est fermée</div></div>
    <button class="bo bsm" onclick="initPush();toast('✅ Notifications activées !')">Activer</button></div>
  </div>
  <div class="card"><div class="ctt">🔗 Google Calendar</div>
    <div style="font-size:12px;color:var(--gr);margin-bottom:10px">Ajoutez vos événements SJ Family directement dans Google Calendar.</div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Synchronisation</div><div style="font-size:11px;color:var(--gr)">Bouton GCal sur chaque événement</div></div><span class="badge bgr">✓ Actif</span></div>
  </div>
  <div class="card"><div class="ctt">⚙️ Raccourcis</div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Statut du couple</div><div style="font-size:11px;color:var(--gr)">Visibilité des raisons</div></div><button class="bo bsm" onclick="go('profile')">Modifier</button></div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Planning de garde</div></div><button class="bo bsm" onclick="go('planning')">Configurer</button></div>
    <div class="sr"><div><div style="font-weight:700;font-size:13px">Règles Firestore</div><div style="font-size:11px;color:var(--gr)">Mettre à jour si page blanche</div></div><button class="bo bsm" onclick="toast('Mettez à jour les règles Firestore dans Firebase Console')">Info</button></div>
  </div>
  <button class="bo" style="color:var(--co);border-color:var(--co);margin-bottom:16px" onclick="doLogout()">🚪 Se déconnecter</button>
  </div>`;
}
window.initPush=initPush;
</script>

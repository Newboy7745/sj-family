name: Règles Firestore (tests)
on:
  push:
    paths: ['firestore.rules', 'tests/rules/**', '.github/workflows/rules-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install -g firebase-tools@13
      - run: npm install
        working-directory: tests/rules
      - name: Tests (émulateur)
        working-directory: tests/rules
        run: |
          set +e
          cp ../../firestore.rules firestore.rules
          firebase emulators:exec --only firestore --project demo-sjf "node test.mjs" > result.txt 2>&1
          echo "EXIT=$?" >> result.txt
          tail -80 result.txt
      - name: Publier le résultat
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tests/rules/result.txt && git commit -m "Résultat des tests de règles" && git push || true
      - name: Échec si un test échoue
        run: grep -q "EXIT=0" tests/rules/result.txt

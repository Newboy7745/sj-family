name: Règles Firestore (tests)
on:
  push:
    paths: ['firestore.rules', 'tests/rules/**', '.github/workflows/rules-test.yml']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install -g firebase-tools@13
      - run: npm install
        working-directory: tests/rules
      - run: firebase emulators:exec --only firestore --project demo-sjf "node test.mjs"
        working-directory: tests/rules
